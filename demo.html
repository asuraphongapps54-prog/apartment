<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอปหอพัก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Anuphan:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ธีมเดียวกับแอปตาม Slide CBC: สว่างแบบห้องปฏิบัติการ พื้นขาว-ฟ้าอ่อน ตัวอักษรน้ำเงินเข้ม
   สีหลักเขียวน้ำทะเล ปุ่มเมนูไล่เฉด เขียว/ฟ้า/ม่วง/ส้ม ตัวหนังสือขยายได้ 3 ระดับ (ผู้ใช้สูงอายุอ่านง่าย) */
:root{
  color-scheme:light;
  --bg:#eef3f7; --surface:#ffffff; --sunk:#f7fafc; --ink:#102a43; --muted:#52677d; --line:#d6e1ea;
  --teal:#0b7a75; --teal-soft:#e1f3f1; --blue:#1f5fae; --blue-soft:#e7eff9; --violet:#5a45a8; --violet-soft:#efecfa;
  --acc:var(--teal); --on-acc:#ffffff;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#a85300; --warn-bg:#fff3df; --bad:#b42318; --bad-bg:#fdeceb; --info:#1f5fae; --info-bg:#e7eff9; --mute-bg:#eceff2;
  --m1:#009688; --m2:#1f5fae; --m3:#5a45a8; --m4:#c07a12;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 4px 14px rgba(16,42,67,.06);
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html{font-size:calc(16px * var(--fs,1.12))}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.86rem}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:40px;height:40px;border-radius:11px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-family:var(--f-head);font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:block;font-size:.8rem;color:var(--muted)}
.brand>div{min-width:0}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:.9rem}
.demo{background:var(--sunk);border-bottom:1px solid var(--line)}
.demo-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-tag{font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

main{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:560px;margin:0 auto;width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h2{font-size:1.5rem}
.date{font-size:.9rem;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--acc)}
.tile:active{transform:scale(.98)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.count{text-align:right;line-height:1.1}
.count b{display:block;font-family:var(--f-head);font-size:1.7rem;font-variant-numeric:tabular-nums}
.count span{font-size:.75rem;color:var(--muted)}
.tile h3{font-size:1.08rem}
.tile p{margin:0;font-size:.85rem;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;align-self:flex-start}
.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.ok{background:var(--ok-bg);color:var(--ok)}

.panel.news{flex-direction:row;gap:14px;align-items:flex-start}
.news .ic{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.news-t{min-width:0;flex:1}
.news-t b{font-family:var(--f-head);font-size:1.05rem;display:block}
.news-t p{margin:2px 0 0;font-size:.9rem;color:var(--muted);white-space:pre-line}

.page-head{display:flex;flex-direction:column;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px 7px 10px;font-weight:600;cursor:pointer}
.back svg{width:20px;height:20px}
.title-row{display:flex;align-items:center;gap:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-acc{background:var(--acc);color:var(--on-acc)}
.btn-acc:hover{filter:brightness(1.07)}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--acc)}
.btn-ok{background:var(--ok);color:var(--surface)}.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn-block{width:100%;padding:14px}
.btn:disabled{opacity:.6;cursor:wait}
.big-act{min-height:76px;font-size:1.02rem;border-radius:14px}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.94rem}
.opt{font-weight:400;color:var(--muted);font-size:.84rem}
.input{width:100%;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.cam{flex:none;width:52px;border:0;border-radius:10px;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center}
.cam svg{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .input{max-width:260px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 2px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item.click{cursor:pointer;border-radius:10px;padding-inline:8px;margin-inline:-6px}
.item.click:hover{background:var(--sunk)}
.item-main{min-width:0}
.item-main b{font-weight:600}
.item-sub{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.item-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tagno{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-open{background:var(--warn-bg);color:var(--warn)}.t-doing{background:var(--info-bg);color:var(--info)}
.t-done{background:var(--ok-bg);color:var(--ok)}.t-issue{background:var(--bad-bg);color:var(--bad)}.t-rejected{background:var(--mute-bg);color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:.92rem}
.alert{padding:11px 14px;border-radius:10px;font-size:.92rem;white-space:pre-line}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}

.ticket-no{border:2.5px dashed var(--acc);border-radius:14px;padding:16px;text-align:center}
.ticket-no b{display:block;font-family:var(--f-mono);font-size:2rem;letter-spacing:.06em;color:var(--acc)}
.done{align-items:center;text-align:center}
.tick{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.94rem;text-align:left}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

.chk{display:flex;flex-direction:column;gap:8px}
.chk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.chk-ph{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk-cam{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--acc);color:var(--acc);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.86rem;cursor:pointer}
.chk-cam svg{width:18px;height:18px}.chk-cam.need{border-style:solid;background:color-mix(in srgb,var(--acc) 8%,var(--surface))}
.chk-ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.chk-ph .tm{font-size:.78rem;color:var(--muted)}
.chk-pv{display:flex;gap:8px;align-items:center}
.chk-row.ok{border-color:var(--ok);background:var(--ok-bg)}.chk-row.no{border-color:var(--bad);background:var(--bad-bg)}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.yn button.y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.yn button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.listcard{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.listcard:hover{border-color:var(--acc)}
.listcard b{font-family:var(--f-head);font-size:1.02rem}

.photo-take{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:14px;background:var(--sunk);color:var(--acc);font-weight:600;cursor:pointer}
.photo-take svg{width:22px;height:22px}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi-h{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--f-head)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.kpi-n{display:flex;gap:16px;flex-wrap:wrap}
.kpi-n div{display:flex;flex-direction:column;line-height:1.2}
.kpi-n b{font-family:var(--f-head);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi-n span{font-size:.75rem;color:var(--muted)}
.kpi-n .bad b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.plot svg{display:block;width:100%}
.plot text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.plot .val{fill:var(--ink);font-weight:600}
.urow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.urow:first-child{border-top:0}

/* บิลค่าเช่า */
.bill{width:100%;border-collapse:collapse;font-size:.94rem}
.bill td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.bill td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.bill .calc{display:block;font-size:.8rem;color:var(--muted)}
.bill tr.sum td{border-top:2px solid var(--ink);font-weight:700;font-size:1.05rem}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mh b{font-family:var(--f-head)}
.mtot{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.mtot.bad{color:var(--bad);font-family:var(--f-body);font-size:.84rem}
.mrow .field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.mrow.billed{grid-template-columns:1fr;color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--acc)}
/* ประกาศใหญ่หน้าแรก */
.newsbig{padding:0;overflow:hidden;gap:0;cursor:pointer;text-align:left;border:1px solid #dde7ef;width:100%;font:inherit;color:inherit}
.newsbig img,.newsimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--sunk)}
.newsbig .nb{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.newsbig .tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:.8rem;border-radius:999px;padding:2px 10px}
.newsbig .tag svg{width:16px;height:16px}
.newsbig h2{font-size:1.35rem}
.newsbig p{margin:0;color:var(--muted);white-space:pre-line}
.newsimg{border-radius:12px;margin-top:8px}
/* เลือกบทบาทในหน้าเข้าสู่ระบบ */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;color:var(--ink);transition:transform .1s,border-color .2s,background .2s}
.role svg{width:28px;height:28px;color:var(--muted)}
.role[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.role[aria-pressed="true"] svg{color:var(--teal)}
.role:active{transform:scale(.97)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-size:.92rem;text-decoration:underline;align-self:center}
.codebox{font-family:var(--f-mono);font-size:2.2rem;letter-spacing:.2em;text-align:center;border:2.5px dashed var(--teal);border-radius:14px;padding:12px;color:var(--teal)}
.urow{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
.urow>.chips{flex-wrap:wrap;gap:6px}
/* ผังห้อง */
.rbld{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rfloor{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.rfl{font-size:.8rem;color:var(--muted);padding-top:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.rc{position:relative;height:40px;border-radius:9px;border:2px solid transparent;font-family:var(--f-mono);font-weight:600;font-size:.88rem;cursor:pointer;transition:transform .1s}
.rc:active{transform:scale(.95)}
.rc-vac{background:var(--mute-bg);color:var(--muted);border-color:var(--line)}
.rc-ok{background:var(--ok-bg);color:var(--ok)}
.rc-due{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.rc-late{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.rc-slip{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.rc-rep{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--m4);border:2px solid #fff}
.rc-dot{display:inline-block;width:12px;height:12px;border-radius:4px}
.rc-dot.rc-vac{border:1px solid var(--line)}
/* แชต */
.thread{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px;background:var(--sunk);border-radius:12px;padding:10px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-line;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal);border-radius:14px 14px 4px 14px}
.bub small{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.sendrow{display:flex;gap:8px}.sendrow .input{flex:1}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700}
/* รถ */
.carcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}
.carcard.ok{border-color:var(--ok)}.carcard.warn{border-color:var(--warn)}

/* ---------- ธีม CBC: ส่วนที่ปรับทับ ---------- */
body{background:linear-gradient(180deg,#e8f1f6 0,var(--bg) 260px) no-repeat,var(--bg)}
.top{border-top:4px solid var(--teal);box-shadow:0 6px 18px rgba(16,42,67,.05)}

.tile{border:0;color:#fff;overflow:hidden;min-height:150px;transition:transform .12s ease,box-shadow .2s ease}
.tile::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.tile::before{content:"";position:absolute;right:18px;bottom:-46px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.tile.t0{background:linear-gradient(150deg,#0f8f88 0%,#0a6b67 100%)}
.tile.t1{background:linear-gradient(150deg,#2b70c4 0%,#1a5196 100%)}
.tile.t2{background:linear-gradient(150deg,#6954bd 0%,#4c3a93 100%)}
.tile.t3{background:linear-gradient(150deg,#d08a1f 0%,#a5650c 100%)}
.tile.tadm{background:linear-gradient(150deg,#28465f 0%,#102a43 100%)}

.tile .ic{background:rgba(255,255,255,.17);color:#fff}

.tile p{color:rgba(255,255,255,.9)}
.count span{color:rgba(255,255,255,.85)}
.flag.bad{background:#fff;color:var(--bad)}
.ic{background:var(--teal-soft);color:var(--teal)}
/* ปุ่มกลับหน้าแรก ใหญ่ ขอบเข้ม */
.back{border:2px solid var(--ink);padding:9px 18px 9px 12px;font-size:1rem;box-shadow:var(--shadow)}
.back svg{width:22px;height:22px}
.btn-acc{box-shadow:0 2px 6px rgba(16,42,67,.14)}
.btn-line:hover{border-color:#b9cad8}
.big-act.btn-acc{background:linear-gradient(150deg,#0f8f88 0%,#0a6b67 100%)}
.big-act.btn-line{background:linear-gradient(150deg,#2b70c4 0%,#1a5196 100%);color:#fff;border:0}
.btn:active,.back:active,.chip:active,.tile:active,.listcard:active,.fs button:active{transform:scale(.97)}
.btn:disabled::before{content:"";width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;flex:none}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,95,174,.13)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.modal{background:rgba(10,24,40,.55)}
.modal-box{border-radius:18px;box-shadow:0 20px 50px rgba(10,24,40,.35)}
.modal-x{background:rgba(16,42,67,.08)}
.toast{box-shadow:0 10px 30px rgba(10,24,40,.3);font-weight:500}
.sk{background:linear-gradient(90deg,#edf2f6 25%,#f7fafc 40%,#edf2f6 60%);background-size:300% 100%;border-radius:12px}
.meter i{background:var(--teal)}
.ticket-no{border-color:var(--teal)}.ticket-no b{color:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .btn:disabled::before{animation:spin .7s linear infinite}
  .sk{animation:sh 1.3s ease infinite}
  .tick{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* ===== ตั้งค่า =====
 * หน้าเว็บเดียวใช้ได้ทุกร้าน: ลิงก์ของร้านคือ  ที่อยู่เว็บ/?s=รหัสร้าน
 * หน้าเว็บจะอ่าน shops.json (ไฟล์ข้างกัน) เพื่อหาลิงก์ /exec ของร้านนั้น
 *   { "baansuan": { "name": "หอพักบ้านสวนจันทร์", "api": "https://script.google.com/macros/s/xxxx/exec" } }
 * ไม่มี ?s= → เปิดโหมดตัวอย่าง (ข้อมูลสมมติ ใช้โชว์ลูกค้า)
 * ถ้าจะใช้กับร้านเดียวแบบไม่มี shops.json ใส่ลิงก์ /exec ที่ FIXED_API ได้
 */
const FIXED_API='';
const SHOP=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();
let API_URL=FIXED_API, DEMO=!FIXED_API&&!SHOP;
const EXEC_RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
async function resolveShop(){
  if(FIXED_API){if(!EXEC_RE.test(FIXED_API))throw new Error('ลิงก์ใน FIXED_API ไม่ถูกต้อง ต้องขึ้นต้นด้วย https://script.google.com/macros/s/ และลงท้ายด้วย /exec\nคัดลอกจาก Apps Script > การทำให้ใช้งานได้ > จัดการการทำให้ใช้งานได้ > URL เว็บแอป (ไม่ใช่ลิงก์ script.googleusercontent.com ในแถบที่อยู่เว็บ)');return}
  if(!SHOP)return;
  if(!/^[a-z0-9-]{2,40}$/.test(SHOP))throw new Error('รหัสร้านในลิงก์ไม่ถูกต้อง ตรวจลิงก์ที่ได้รับอีกครั้ง');
  let list;
  try{const r=await fetch('shops.json',{cache:'no-store'});if(!r.ok)throw 0;list=await r.json()}
  catch(e){throw new Error('โหลดรายชื่อร้านไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  const shop=list[SHOP];
  if(!shop||!EXEC_RE.test(shop.api||''))throw new Error('ไม่พบร้านรหัส "'+SHOP+'" ติดต่อผู้ติดตั้งระบบ');
  API_URL=shop.api;
}

async function run(fn,...args){
  if(DEMO){await new Promise(r=>setTimeout(r,160));const f=Mock.api[fn];if(!f)throw new Error('โหมดตัวอย่างไม่มีคำสั่งนี้');return JSON.parse(JSON.stringify(f(...args)))}
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
  catch(e){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  let j;try{j=await res.json()}catch(e){throw new Error('ระบบตอบกลับผิดรูปแบบ ให้ผู้ดูแลตรวจการติดตั้ง Apps Script')}
  if(!j.ok){if(/เข้าสู่ระบบใหม่|กรุณาเข้าสู่ระบบ/.test(j.error)){clearTok();ME=null}throw new Error(j.error)}
  return j.data;
}

const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

/* ===== รูปหลักฐาน ===== */
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('อ่านรูปไม่ได้ ถ่ายใหม่อีกครั้ง'))};img.src=u})}
/* ย่อรูปและพิมพ์วันเวลา จุดตรวจ ชื่อผู้ถ่าย ลงบนรูป (กันเอารูปเก่ามาใช้ซ้ำ) */
function shrinkStamp(file,label){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas'),W=c.width=Math.round(img.width*k),Hh=c.height=Math.round(img.height*k),g=c.getContext('2d');
    g.drawImage(img,0,0,W,Hh);URL.revokeObjectURL(u);const fs=Math.max(14,Math.round(W/34)),bh=Math.round(fs*3.3),d=new Date();
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,Hh-bh,W,bh);g.fillStyle='#fff';g.textBaseline='middle';
    const fit=(t,w,sz)=>{let z=sz;do{g.font=`${w} ${z}px "IBM Plex Sans Thai",sans-serif`;z--}while(z>8&&g.measureText(t).width>W-fs*1.4);return t};
    g.fillText(fit(`${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543} · ${p2(d.getHours())}:${p2(d.getMinutes())} น.`,700,fs),fs*.7,Hh-bh+fs*1.05);
    g.fillText(fit(String(label).slice(0,80),500,Math.round(fs*.85)),fs*.7,Hh-bh+fs*2.3);
    res(c.toDataURL('image/jpeg',.7))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('อ่านรูปไม่ได้ ถ่ายใหม่อีกครั้ง'))};img.src=u})}

  <label class="photo-take" for="${id}">${icon('camera')}<span>แตะเพื่อถ่ายรูป</span></label></div>
  <input type="file" id="${id}" accept="image/*" capture="environment" style="position:absolute;opacity:0;width:1px;height:1px"></div>`;

    try{const d=await shrink(f);cb(d);box.innerHTML=`<div class="photo-prev"><img src="${d}" alt="รูปหลักฐาน"><label class="btn btn-line btn-sm" for="${id}">ถ่ายใหม่</label></div>`}

function modal(html){const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="modal-box">${html}<button class="modal-x" aria-label="ปิด">✕</button></div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};
  m.addEventListener('click',e=>{if(e.target===m)close()});m.querySelector('.modal-x').onclick=close;document.addEventListener('keydown',k);
  document.body.appendChild(m);const f=m.querySelector('input,textarea');(f||m.querySelector('.modal-x')).focus();return {el:m,close}}

/* ===== แจ้งเตือนในแอป: หน้าแรกเปิดค้างไว้ ระบบเช็กงานใหม่ทุก 60 วินาที มีงานเพิ่ม = เสียงติ๊ง + ตัวเลขบนแท็บ ===== */
let lastTotal=null,actx=null;
const totalOf=h=>Object.values(h.counts).reduce((s,c)=>s+c.open,0);
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.18].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i?1046:784;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.16);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.17)})}catch(e){}}
function badge(n){document.title=(n?`(${n}) `:'')+(BIZ?BIZ.org:'แอปหอพัก')}
setInterval(async()=>{if(!ME||view.name!=='home'||document.hidden||document.querySelector('.modal'))return;
  try{const h=await run('apiHome',tok());const t=totalOf(h);
    if(lastTotal!=null&&t>lastTotal){beep();if(navigator.vibrate)navigator.vibrate([80,60,80]);toast('มีงานใหม่ '+(t-lastTotal)+' รายการ');vHome()}
    lastTotal=t;badge(t)}catch(e){}},60000);

/* ===== รายละเอียดรายการ (ป๊อปอัป) ===== */
function detail(m,r,after){
  if(m.kind==='billing')return billDetail(m,r,after);
  const rows=[['เลขรายการ',`<span class="mono">${esc(r.id)}</span>`]];
  if(r.code)rows.push([m.codeLabel||'บาร์โค้ด',`<span class="mono">${esc(r.code)}</span>`]);
  if(m.kind==='ticket'||(m.cats&&r.cat))rows.push([m.kind==='ticket'?'หมวด':'มาทำอะไร',esc(r.cat)]);
  rows.push([m.ownerLabel||m.whereLabel||'เรื่อง',esc(r.owner)]);
  if(r.detail)rows.push([m.detailLabel||'รายละเอียด',esc(r.detail)]);
  rows.push([m.atLabel||'บันทึกโดย',`${esc(r.by)}<br><span class="small muted">${esc(r.at)}${r.st==='open'?' · '+ago(r.atTs)+'ที่แล้ว':''}</span>`]);
  if(r.photo&&m.kind!=='check')rows.push(['รูปหลักฐาน',r.photo.startsWith('http')?`<a href="${esc(r.photo)}" target="_blank" rel="noopener">เปิดดูรูป</a>`:'มีรูปแนบ (ผู้ดูแลเปิดดูได้)']);
  if(r.closeBy)rows.push([r.st==='doing'?'ผู้รับงาน':m.closeAtLabel||'ปิดงานโดย',`${esc(r.closeBy)}${r.closeAt?`<br><span class="small muted">${esc(r.closeAt)}</span>`:''}`]);
  if(r.extra&&r.extra.park)rows.push(['ค่าจอด',`${r.extra.park.fee?baht(r.extra.park.fee)+' บาท':'ไม่มี'}<br><span class="small muted">จอด ${dur(r.extra.park.mins)} · ฟรี ${r.extra.park.freeMin} นาที · ชม.ละ ${baht(r.extra.park.perHour)}</span>`]);
  if(r.note)rows.push([m.kind==='track'?m.closeWhoLabel:'หมายเหตุ',esc(r.note)]);
  const checks=m.kind==='check'&&r.extra&&r.extra.items?`<div class="chk">${r.extra.items.map(i=>`<div class="chk-row ${i.ok?'ok':'no'}"><span>${esc(i.t)}</span><b>${i.ok?'ผ่าน':'ไม่ผ่าน'}</b>${i.photo?`<div class="chk-ph">${i.photo.startsWith('data:image/')?`<img src="${esc(i.photo)}" alt="รูป ${esc(i.t)}" data-zp="${esc(i.t)}">`:`<a href="${esc(i.photo)}" target="_blank" rel="noopener">${icon('camera','pico')} เปิดดูรูป</a>`}${i.at?`<span class="tm">ถ่ายเมื่อ ${esc(i.at)} น.</span>`:''}</div>`:''}</div>`).join('')}</div>`:'';
  const mm=modal(`<div style="padding-right:40px"><div class="small muted">${esc(m.label)}</div><h2>${esc(r.owner)}</h2></div>${pill(m,r)}
    ${r.overdue?`<div class="alert bad">เกินกำหนดแล้ว (เกิน ${m.overdueHrs>=48?Math.round(m.overdueHrs/24)+' วัน':m.overdueHrs+' ชั่วโมง'})</div>`:''}
    <dl class="kv">${rows.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl>${checks}<div id="d-act" class="form"></div>`);
  mm.el.querySelectorAll('[data-zp]').forEach(im=>im.onclick=()=>modal(`<h2 style="padding-right:40px">${esc(im.dataset.zp)}</h2><img class="slipbig" src="${im.src}" alt="">`));
  const box=mm.el.querySelector('#d-act');
  const done=()=>{mm.close();after&&after()};
  if(m.kind==='track'&&r.st==='open')closeForm(box,m,r,done);

const parkFee=(p,mins)=>mins>p.freeMin?Math.ceil((mins-p.freeMin)/60)*p.perHour:0;
function closeForm(box,m,r,done){
  const pk=m.parking&&r.code?m.parking:null,mins=pk?Math.max(0,Math.round((Date.now()-r.atTs)/60000)):0;

      const f=x.extra&&x.extra.park&&x.extra.park.fee;toast(m.closeVerb+' แล้ว'+(f?' · เก็บค่าจอด '+baht(f)+' บาท':''));done()}
    catch(err){box.querySelector('#c-err').innerHTML=errBox(err.message);busy(b,false)}};

function ticketActs(box,m,r,done){

function fixForm(box,r,done){

/* รายการพร้อมตัวกรอง */

/* ===== เงิน: ตัวอักษรไทย · พร้อมเพย์ · พิมพ์เอกสาร ===== */
const TH_MONF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const money=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const isoD=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const isoTH=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?`${+m[3]} ${TH_MONF[+m[2]-1]} ${+m[1]+543}`:(s||'')};
const dateTH=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(s||'');return m?`${+m[1]} ${TH_MONF[+m[2]-1]} ${+m[3]+543}`:(s||'')};
const fmtDate=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})(?: (\d{2}):(\d{2}))?/.exec(s||'');return m?new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):null};
const daysTo=iso=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+'T00:00:00')-t)/86400000)};
/* จำนวนเงินเป็นตัวอักษร เช่น 1,250.50 → หนึ่งพันสองร้อยห้าสิบบาทห้าสิบสตางค์ */
function bahtText(n){n=Math.round(Math.abs(Number(n)||0)*100)/100;if(!n)return 'ศูนย์บาทถ้วน';
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],U=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const six=s=>{let o='';const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
    o+=p===0&&d===1&&L>1&&+s.slice(0,-1)>0?'เอ็ด':p===1&&d===1?'สิบ':p===1&&d===2?'ยี่สิบ':D[d]+U[p]}return o};
  const say=s=>{s=s.replace(/^0+/,'');if(s.length<=6)return six(s);const lo=s.slice(-6);return say(s.slice(0,-6))+'ล้าน'+(+lo===1?'เอ็ด':six(lo))};
  const b=Math.floor(n),st=Math.round((n-b)*100);
  return (b?say(String(b))+'บาท':'')+(st?say(String(st))+'สตางค์':'ถ้วน')}
/* QR พร้อมเพย์ใส่ยอด ตามมาตรฐาน EMVCo (Thai QR Payment) */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amt){id=String(id||'').replace(/\D/g,'');const f=(t,v)=>t+String(v.length).padStart(2,'0')+v;
  const acc=id.length>=15?f('03',id):id.length>=13?f('02',id):f('01',('0000000000000'+id.replace(/^0/,'66')).slice(-13));
  const a=Number(amt)>0?Number(amt).toFixed(2):'';
  const s=f('00','01')+f('01',a?'12':'11')+f('29',f('00','A000000677010111')+acc)+f('58','TH')+f('53','764')+(a?f('54',a):'')+'6304';
  return s+crc16(s)}
const ppShow=id=>{id=String(id||'');return id.length===10?id.slice(0,3)+'-'+id.slice(3,6)+'-'+id.slice(6):id.length===13?id[0]+'-'+id.slice(1,5)+'-'+id.slice(5,10)+'-'+id.slice(10,12)+'-'+id[12]:id};
let qrLib=null;
const loadQR=()=>qrLib||(qrLib=new Promise((res,rej)=>{if(window.qrcode)return res(window.qrcode);const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=()=>window.qrcode?res(window.qrcode):rej(new Error('no qr'));
  s.onerror=()=>{qrLib=null;s.remove();rej(new Error('โหลดตัวสร้าง QR ไม่ได้'))};document.head.appendChild(s)}));
async function qrSvg(text){const q=(await loadQR())(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:3,scalable:true})}
/* กล่องจ่ายเงิน: QR + ชื่อบัญชี + ปุ่มคัดลอกเลข (ถ้าโหลด QR ไม่ได้ก็ยังโอนด้วยเลขได้) */
function payBox(pay,amt,demo){

    catch(e){el.innerHTML='<div class="small muted">สร้าง QR ไม่ได้ตอนนี้ โอนด้วยเลขพร้อมเพย์ด้านขวาแทนได้</div>'}
    const c=el.parentNode.querySelector('[data-copypp]');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(pay.pp);toast('คัดลอกเลขพร้อมเพย์แล้ว')}catch(x){toast(ppShow(pay.pp))}}},0);
  return `<div class="qrbox"><div class="qrimg${demo?' qrdemo':''}" id="${id}"><span class="small muted">กำลังสร้าง QR…</span></div>

      <div><span class="small muted">ชื่อบัญชี</span><br><b>${esc(pay.name)}</b>${pay.bank?`<div class="small muted">${esc(pay.bank)}</div>`:''}</div>

      <button type="button" class="btn btn-line btn-sm" data-copypp>${icon('copy')}คัดลอกเลข</button></div>
    <div class="small muted qrtip">ตรวจชื่อบัญชีในแอปธนาคารให้ตรงก่อนกดโอน · ใช้มือถือเครื่องเดียวกัน: แคปหน้าจอ แล้วเลือกรูปนี้ในเมนูสแกนของแอปธนาคาร${demo?'<br><b>QR ตัวอย่างในโหมดเดโม ห้ามโอนเงินจริง</b>':''}</div></div>`}
/* พิมพ์ / บันทึกเป็น PDF เฉพาะเอกสาร */
function printDoc(html,title){let r=document.getElementById('printroot');if(!r){r=document.createElement('div');r.id='printroot';r.setAttribute('data-notr','');document.body.appendChild(r)}
  r.innerHTML=html;const h=document.documentElement,t0=document.title;h.classList.add('print-mode');if(title)document.title=title;
  const done=()=>{h.classList.remove('print-mode');document.title=t0;window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);setTimeout(()=>{try{window.print()}catch(e){done()}},60)}
function docModal(title,html,file){const mm=modal(`<h2 style="padding-right:40px">${esc(title)}</h2><div class="docwrap" data-notr>${html}</div>
  <div class="actions"><button class="btn btn-acc" data-print>${icon('doc')}พิมพ์ / บันทึกเป็น PDF</button></div>

  mm.el.querySelector('[data-print]').onclick=()=>printDoc(html,file||title);return mm}

/* ===== lease: สัญญาเช่า ย้ายเข้า ย้ายออก คืนเงินประกัน ===== */
const ROOM_SPOTS=['ประตูและลูกบิด','พื้นและผนัง','ห้องน้ำ','แอร์ / พัดลม','เฟอร์นิเจอร์','มิเตอร์น้ำ-ไฟ'];
const DED_QUICK=['ทำความสะอาดคราบหนัก','ซ่อมผนังเป็นรู','กุญแจหาย','เฟอร์นิเจอร์ชำรุด','รีโมทแอร์หาย'];
const leaseMod=()=>BIZ&&BIZ.modules.find(x=>x.kind==='lease');
const getLeases=()=>run('apiLeases',tok());
/* ช่องถ่ายรูปตามจุด (พิมพ์วันเวลา ห้อง จุด ลงบนรูป) · ref = รูปตอนย้ายเข้าไว้เทียบ */
function spotPicker(box,pre,room,ref){const ph={};
  box.innerHTML=ROOM_SPOTS.map((l,i)=>{const r=(ref||[]).find(x=>x.label===l);return `<div class="spot">
    <label class="spot-take" for="${pre}${i}" id="${pre}b${i}">${icon('camera')}<span>${esc(l)}</span></label>
    <input type="file" id="${pre}${i}" accept="image/*" capture="environment" style="position:absolute;opacity:0;width:1px;height:1px">
    ${r?(String(r.url||'').startsWith('data:')?`<button type="button" class="spot-ref" data-ref="${i}"><img src="${esc(r.url)}" alt=""><span>ตอนย้ายเข้า</span></button>`:`<a class="spot-ref" href="${esc(r.url)}" target="_blank" rel="noopener"><span>ดูรูปตอนย้ายเข้า</span></a>`):''}</div>`}).join('');
  box.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{const r=ref.find(x=>x.label===ROOM_SPOTS[+b.dataset.ref]);modal(`<h2 style="padding-right:40px">ตอนย้ายเข้า · ${esc(r.label)}</h2><img class="slipbig" src="${esc(r.url)}" alt="">`)});
  ROOM_SPOTS.forEach((l,i)=>{const inp=box.querySelector('#'+pre+i),b=box.querySelector('#'+pre+'b'+i);
    inp.onchange=async()=>{const f=inp.files[0];inp.value='';if(!f)return;b.classList.add('busy');
      try{const d=await shrinkStamp(f,`ห้อง ${room()} · ${l} · ${BIZ.org}`);ph[l]=d;b.innerHTML=`<img src="${d}" alt="${esc(l)}"><span>${esc(l)} ✓</span>`;b.classList.add('done')}
      catch(e){toast(e.message)}b.classList.remove('busy')}});
  return ()=>ROOM_SPOTS.filter(l=>ph[l]).map(l=>({label:l,data:ph[l]}))}
function gallery(title,list){if(!list||!list.length)return '';
  return `<div class="field"><span class="lab">${esc(title)} (${list.length} รูป)</span><div class="gal">${list.map((p,i)=>String(p.url||'').startsWith('data:')
    ?`<button type="button" class="gal-i" data-gal="${esc(p.url)}" data-gl="${esc(p.label)}"><img src="${esc(p.url)}" alt="${esc(p.label)}"><span>${esc(p.label)}</span></button>`
    :`<a class="gal-i" href="${esc(p.url)}" target="_blank" rel="noopener">${icon('camera')}<span>${esc(p.label||'รูปที่ '+(i+1))}</span></a>`).join('')}</div></div>`}
const bindGal=el=>el.querySelectorAll('[data-gal]').forEach(b=>b.onclick=()=>modal(`<h2 style="padding-right:40px">${esc(b.dataset.gl)}</h2><img class="slipbig" src="${esc(b.dataset.gal)}" alt="">`));
const depCap=(rent,dep,adv)=>dep+adv>rent*3?`<div class="alert warn small">เงินประกัน + ค่าเช่าล่วงหน้า รวม ${baht(dep+adv)} บาท เกิน 3 เท่าของค่าเช่า · ประกาศ สคบ. ว่าด้วยสัญญาเช่าที่อยู่อาศัย (ผู้ให้เช่าเชิงธุรกิจ) จำกัดยอดรวมไว้ ตรวจฉบับล่าสุดก่อนเรียกเก็บ</div>`:'';
function leaseInForm(d,pre,after,old){
  const list=old?d.unleased:d.vacant;
  if(!list.length)return toast(old?'ทุกห้องที่มีผู้เช่ามีสัญญาในระบบแล้ว':'ไม่มีห้องว่าง ย้ายผู้เช่าเดิมออกก่อน หรือเพิ่มห้อง');
  const t=new Date(),e=new Date(t.getFullYear()+1,t.getMonth(),t.getDate()-1);
  const mm=modal(`<h2>${old?'ทำสัญญาให้ผู้เช่าเดิม':'ย้ายเข้า / ทำสัญญาใหม่'}</h2>
    ${old?'<div class="alert info small">สำหรับผู้เช่าที่อยู่ก่อนเริ่มใช้แอป ใส่วันที่และยอดตามสัญญากระดาษเดิม ห้องจะยังเป็น "มีผู้เช่า" ตามเดิม</div>':''}
    <form class="form" id="li" novalidate>
    <div class="field"><label for="li-room">ห้อง</label><select class="input" id="li-room">${list.map(r=>`<option value="${esc(r.room)}" ${r.room===pre?'selected':''}>ห้อง ${esc(r.room)} · ${esc(r.typeLabel||'')} · ${baht(r.rent)} บาท${old?' · '+esc(r.tenant):''}</option>`).join('')}</select></div>
    <div class="field"><label for="li-t">ชื่อ-นามสกุลผู้เช่า</label><input class="input" id="li-t" autocomplete="off" maxlength="80"></div>
    <div class="field"><label for="li-p">เบอร์มือถือ <span class="opt">(ผู้เช่าสมัครแอปด้วยเบอร์นี้แล้วใช้ได้ทันที)</span></label><input class="input mono" id="li-p" inputmode="tel" autocomplete="off"></div>
    <div class="row2"><div class="field"><label for="li-s">เริ่มสัญญา</label><input class="input" type="date" id="li-s" value="${isoD(t)}"></div>
      <div class="field"><label for="li-e">สิ้นสุดสัญญา</label><input class="input" type="date" id="li-e" value="${isoD(e)}"></div></div>
    <div class="chips" id="li-len">${[[6,'6 เดือน'],[12,'1 ปี'],[24,'2 ปี']].map(([n,l])=>`<button type="button" class="chip" data-len="${n}" aria-pressed="${n===12}">${l}</button>`).join('')}</div>
    <div class="row2" style="grid-template-columns:1fr 1fr 1fr"><div class="field"><label for="li-r" class="small">ค่าเช่า/เดือน</label><input class="input mono" id="li-r" inputmode="decimal"></div>
      <div class="field"><label for="li-d" class="small">เงินประกัน</label><input class="input mono" id="li-d" inputmode="decimal"></div>
      <div class="field"><label for="li-a" class="small">ค่าเช่าล่วงหน้า</label><input class="input mono" id="li-a" inputmode="decimal"></div></div>
    <div id="li-cap"></div>
    ${old?'':`<div class="row2"><div class="field"><label for="li-w" class="small">มิเตอร์น้ำวันย้ายเข้า</label><input class="input mono" id="li-w" inputmode="decimal"></div>
      <div class="field"><label for="li-m" class="small">มิเตอร์ไฟวันย้ายเข้า</label><input class="input mono" id="li-m" inputmode="decimal"></div></div>`}
    <div class="field"><span class="lab">รูปสภาพห้อง${old?'':'วันย้ายเข้า'} <span class="opt">(แนะนำ ใช้เทียบตอนย้ายออก)</span></span><div class="spots" id="li-ph"></div></div>
    <div class="field"><label for="li-n">หมายเหตุ <span class="opt">(เช่น กุญแจ 2 ดอก รีโมทแอร์ 1 อัน)</span></label><textarea class="input" id="li-n" rows="2" maxlength="500"></textarea></div>
    <div id="li-err"></div><button class="btn btn-acc btn-block" type="submit">บันทึกสัญญา</button></form>`);
  const q=s=>mm.el.querySelector(s),R=()=>list.find(r=>r.room===q('#li-room').value);
  const fill=()=>{const r=R();q('#li-r').value=r.rent;q('#li-d').value=r.rent;q('#li-a').value=r.rent;
    if(old){q('#li-t').value=r.tenant||'';q('#li-p').value=r.phone||''}else{q('#li-w').placeholder='เดิม '+baht(r.w);q('#li-m').placeholder='เดิม '+baht(r.e)}cap()};
  const cap=()=>{q('#li-cap').innerHTML=depCap(+q('#li-r').value||0,+q('#li-d').value||0,+q('#li-a').value||0)};
  ['#li-r','#li-d','#li-a'].forEach(s=>q(s).addEventListener('input',cap));
  q('#li-room').onchange=fill;fill();
  mm.el.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{const s=new Date(q('#li-s').value+'T00:00:00');if(isNaN(s))return;
    q('#li-e').value=isoD(new Date(s.getFullYear(),s.getMonth()+(+b.dataset.len),s.getDate()-1));mm.el.querySelectorAll('[data-len]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const photos=spotPicker(q('#li-ph'),'lis',()=>q('#li-room').value);
  q('#li').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button[type=submit]');busy(b,true,'กำลังบันทึก…');
    try{const v=s=>q(s)?q(s).value.trim():'';
      const l=await run('apiLeaseIn',tok(),{room:v('#li-room'),tenant:v('#li-t'),phone:v('#li-p'),start:v('#li-s'),end:v('#li-e'),rent:v('#li-r'),deposit:v('#li-d')||0,advance:v('#li-a')||0,
        w:v('#li-w'),e:v('#li-m'),photos:photos(),note:v('#li-n'),existing:!!old});
      mm.close();toast('บันทึกสัญญา '+l.id+' แล้ว · ห้อง '+l.room+' เป็น "มีผู้เช่า"');after&&after();
      const d2=await getLeases().catch(()=>null);const l2=d2&&d2.leases.find(x=>x.id===l.id);if(l2)leaseDoc(l2,d2)}
    catch(x){q('#li-err').innerHTML=errBox(x.message);busy(b,false)}};
}
function leaseDocHtml(l,d){const r=d.rates||{};
  const map={NO:l.id,ORG:d.org,DATE:dateTH(l.inAt)||isoTH(isoD(new Date())),TENANT:l.tenant,PHONE:l.phone||'-',ROOM:l.room,START:isoTH(l.start),END:isoTH(l.end),
    RENT:baht(l.rent),COMMON:baht(l.common||0),WATER:baht(r.water),ELEC:baht(r.elec),DEPOSIT:baht(l.deposit),ADVANCE:baht(l.advance)};
  const lines=esc(d.tpl||'').replace(/\{([A-Z]+)\}/g,(m0,k)=>k in map?esc(map[k]):m0).split('\n');
  return `<div class="doc lease"><div class="doc-t">${lines[0]}</div>${lines.slice(1).map(x=>x.trim()?`<p>${x}</p>`:'<div class="doc-gap"></div>').join('')}
    ${l.inPhotos&&l.inPhotos.length?`<p class="small">แนบท้าย: รูปสภาพห้องวันย้ายเข้า ${l.inPhotos.length} รูป (${l.inPhotos.map(p=>esc(p.label)).join(', ')}) เก็บไว้ในระบบ</p>`:''}</div>`}
const leaseDoc=(l,d)=>docModal('สัญญาเช่า ห้อง '+l.room,leaseDocHtml(l,d),'สัญญาเช่า '+l.id);
function settleHtml(l,d){const ded=l.deduct||[],sd=ded.reduce((s,x)=>s+x.amount,0);
  return `<div class="doc"><div class="doc-h"><b class="doc-org">${esc(d.org)}</b></div><div class="doc-t">ใบสรุปการคืนเงินประกัน</div>
    <div class="doc-meta"><div>สัญญา <b class="mono">${esc(l.id)}</b></div><div>ย้ายออก ${esc(dateTH(l.outAt))}</div></div>
    <div class="doc-to">ผู้เช่า <b>${esc(l.tenant)}</b> · ห้อง <b>${esc(l.room)}</b> · สัญญา ${esc(isoTH(l.start))} – ${esc(isoTH(l.end))}</div>
    <table class="doc-tbl"><tbody><tr><td>เงินประกัน</td><td>${money(l.deposit)}</td></tr><tr><td>ค่าเช่าล่วงหน้า</td><td>${money(l.advance)}</td></tr>
      ${ded.map(x=>`<tr><td>หัก: ${esc(x.item)}</td><td>−${money(x.amount)}</td></tr>`).join('')}
      ${l.unpaid?`<tr><td>หัก: บิลที่ยังไม่ได้ชำระ</td><td>−${money(l.unpaid)}</td></tr>`:''}
      <tr class="sum"><td>${l.refund>=0?'คืนให้ผู้เช่า':'ผู้เช่าต้องชำระเพิ่ม'}</td><td>${money(Math.abs(l.refund))}</td></tr></tbody></table>
    <div class="doc-words">(${bahtText(l.refund)})</div>
    ${sd?'<p class="small">รายการหักเป็นค่าความเสียหายที่เกินการใช้งานปกติ มีรูปถ่ายวันย้ายเข้าและย้ายออกเป็นหลักฐานในระบบ</p>':''}
    ${l.refundAt?`<p>คืนเงินแล้วเมื่อ ${esc(dateTH(l.refundAt))}</p>`:''}
    <div class="doc-sign two"><div>ลงชื่อ ............................ ผู้ให้เช่า</div><div>ลงชื่อ ............................ ผู้เช่า<br>(${esc(l.tenant)})</div></div></div>`}
function leaseDetail(l,d,after){const S=d.states,on=l.state===S.on,out=l.state===S.out,ded=l.deduct||[];
  const late=out&&l.outAt?Math.floor((Date.now()-fmtDate(l.outAt))/86400000):0,left=daysTo(l.end);
  const mm=modal(`<div style="padding-right:40px"><div class="small muted">สัญญา ${esc(l.id)}</div><h2>ห้อง ${esc(l.room)}</h2><div class="muted">${esc(l.tenant)}${l.phone?' · <span class="mono">'+esc(l.phone)+'</span>':''}</div></div>
    <span class="pill ${on?'t-done':out?'t-open':'t-rejected'}">${esc(l.state)}</span>
    ${on&&left<0?`<div class="alert warn">เลยวันสิ้นสุดสัญญามา ${-left} วัน ต่อสัญญาใหม่หรือนัดวันย้ายออก</div>`:on&&left<=30?`<div class="alert info">สัญญาจะหมดในอีก ${left} วัน</div>`:''}
    ${out?`<div class="alert ${late>7?'bad':'warn'}">ต้องคืนเงิน ${baht(l.refund)} บาท · ย้ายออกมาแล้ว ${late} วัน${late>7?' (เกิน 7 วัน)':''} · ประกาศ สคบ. ให้คืนเงินประกันภายใน 7 วันหลังสิ้นสุดสัญญา</div>`:''}
    <dl class="kv"><dt>ระยะสัญญา</dt><dd>${esc(isoTH(l.start))} – ${esc(isoTH(l.end))}</dd>
      <dt>ค่าเช่า</dt><dd>${baht(l.rent)}${l.common?' + ส่วนกลาง '+baht(l.common):''} บาท/เดือน</dd>
      <dt>เงินประกัน</dt><dd>${baht(l.deposit)} บาท</dd><dt>ค่าเช่าล่วงหน้า</dt><dd>${baht(l.advance)} บาท</dd>
      <dt>ย้ายเข้า</dt><dd>${esc(l.inAt)}${l.by?`<br><span class="small muted">บันทึกโดย ${esc(l.by)}</span>`:''}</dd>${l.inNote?`<dt>หมายเหตุ</dt><dd>${esc(l.inNote)}</dd>`:''}
      ${on&&l.unpaidNow?`<dt>ค้างชำระตอนนี้</dt><dd><b class="late">${baht(l.unpaidNow)} บาท</b></dd>`:''}
      ${l.outAt?`<dt>ย้ายออก</dt><dd>${esc(l.outAt)}</dd><dt>รายการหัก</dt><dd>${ded.length?ded.map(x=>esc(x.item)+' '+baht(x.amount)).join('<br>'):'ไม่มี'}${l.unpaid?'<br>บิลค้าง '+baht(l.unpaid):''}</dd>
        <dt>${l.refund>=0?'ยอดคืนผู้เช่า':'ผู้เช่าต้องจ่ายเพิ่ม'}</dt><dd><b>${baht(Math.abs(l.refund))} บาท</b></dd>${l.refundAt?`<dt>คืนเงินเมื่อ</dt><dd>${esc(l.refundAt)}</dd>`:''}`:''}
      ${l.note?`<dt>บันทึก</dt><dd>${esc(l.note)}</dd>`:''}</dl>
    ${gallery('รูปวันย้ายเข้า',l.inPhotos)}${gallery('รูปวันย้ายออก',l.outPhotos)}
    <div class="stack"><button class="btn btn-line" id="ld-doc">${icon('doc')}ดู / พิมพ์สัญญา</button>
      ${l.outAt?`<button class="btn btn-line" id="ld-set">${icon('receipt')}ใบสรุปการคืนเงินประกัน</button>`:''}
      ${on?`<button class="btn btn-bad" id="ld-out">${icon('outbox')}ย้ายออก / คืนห้อง</button>`:''}
      ${out?`<div class="field"><label for="ld-rn">บันทึกการคืนเงิน <span class="opt">(เช่น โอนเข้าบัญชีผู้เช่า)</span></label><input class="input" id="ld-rn" maxlength="200"></div><button class="btn btn-ok" id="ld-ref">คืนเงินประกันแล้ว ${baht(l.refund)} บาท</button>`:''}
      <div id="ld-err"></div></div>`);
  bindGal(mm.el);
  mm.el.querySelector('#ld-doc').onclick=()=>leaseDoc(l,d);
  const st=mm.el.querySelector('#ld-set');if(st)st.onclick=()=>docModal('ใบสรุปการคืนเงินประกัน ห้อง '+l.room,settleHtml(l,d),'คืนเงินประกัน '+l.id);
  const o=mm.el.querySelector('#ld-out');if(o)o.onclick=()=>{mm.close();leaseOutForm(l,d,after)};
  const rf=mm.el.querySelector('#ld-ref');if(rf)rf.onclick=async()=>{busy(rf,true);
    try{await run('apiLeaseRefund',tok(),l.id,{note:mm.el.querySelector('#ld-rn').value.trim()});mm.close();toast('ปิดสัญญาแล้ว');after&&after()}
    catch(e){mm.el.querySelector('#ld-err').innerHTML=errBox(e.message);busy(rf,false)}};
}
function leaseOutForm(l,d,after){const base=l.deposit+l.advance,un=l.unpaidNow||0;
  const mm=modal(`<h2>ย้ายออก ห้อง ${esc(l.room)}</h2><div class="muted">${esc(l.tenant)} · สัญญา ${esc(l.id)}</div>
    <div class="alert info small">ออกบิลค่าน้ำค่าไฟรอบสุดท้ายก่อนกดย้ายออก ระบบจะหักบิลที่ยังไม่ได้ชำระจากเงินประกันให้ · หักได้เฉพาะความเสียหายที่เกินการใช้งานปกติ พร้อมรูปเป็นหลักฐาน</div>
    <div class="field"><span class="lab">รายการหัก <span class="opt">(ถ้ามี)</span></span><div id="lo-d" class="stack"></div>
      <div class="chips">${DED_QUICK.map(x=>`<button type="button" class="chip" data-q="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>
      <button type="button" class="btn btn-line btn-sm" id="lo-add">${icon('plus')}เพิ่มรายการ</button></div>
    <div class="field"><span class="lab">รูปสภาพห้องวันย้ายออก <span class="opt">(ถ่ายจุดเดียวกับตอนย้ายเข้า)</span></span><div class="spots" id="lo-ph"></div></div>
    <div class="field"><label for="lo-n">หมายเหตุ</label><textarea class="input" id="lo-n" rows="2" maxlength="500"></textarea></div>
    <div class="refbox" id="lo-sum"></div><div id="lo-err"></div>
    <button class="btn btn-bad btn-block" id="lo-ok">ยืนยันย้ายออก</button>
    <div class="small muted">กดแล้ว: ห้องเป็น "ว่าง" และบัญชีแอปของผู้เช่าห้องนี้ถูกระงับ</div>`);
  const q=s=>mm.el.querySelector(s),box=q('#lo-d');
  const addRow=(item,amt)=>{box.insertAdjacentHTML('beforeend',`<div class="scanrow ded"><input class="input" data-di value="${esc(item||'')}" placeholder="รายการ" aria-label="รายการหัก" maxlength="80"><input class="input mono" data-da inputmode="decimal" value="${amt||''}" placeholder="บาท" aria-label="จำนวนเงิน" style="max-width:120px"><button type="button" class="btn btn-bad btn-sm" data-del aria-label="ลบรายการ">${icon('trash')}</button></div>`);

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function drawBars(el,s){
  const W=Math.max(280,el.clientWidth),H=220,L=30,R=8,T=14,B=26,pw=W-L-R,ph=H-T-B;
  const tot=d=>s.modules.reduce((a,m)=>a+(d.n[m.id]||0),0);
  const max=niceMax(Math.max(1,...s.daily.map(tot)));
  const step=pw/s.daily.length,bw=Math.max(3,Math.min(30,step*.62));
  const every=s.daily.length<=7?1:s.daily.length<=30?5:15;
  let g='';
  [0,.5,1].forEach(f=>{const y=T+ph-ph*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(max*f)}</text>`});
  s.daily.forEach((d,i)=>{const x=L+i*step+(step-bw)/2;let y=T+ph;
    s.modules.forEach((m,j)=>{const v=d.n[m.id]||0;if(!v)return;const h=ph*v/max;y-=h;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h-1)}" rx="2" fill="${MCOL[j%4]}"><title>${esc(m.label)} ${v}</title></rect>`});
    if(i%every===0||i===s.daily.length-1){const [yy,mm,dd]=d.d.split('-');g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${+dd}/${+mm}</text>`}});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="จำนวนรายการใหม่ต่อวัน แยกตามเมนู">${g}</svg>`;
}

    app.querySelectorAll('#pane [data-privacy]').forEach(b=>b.onclick=showPrivacy);
    $('#pvs').onclick=async e=>{const b=e.currentTarget;busy(b,true);try{await run('apiSavePrivacy',tok(),$('#pv-t').value);toast('บันทึกข้อความแล้ว');$('#pve').innerHTML=''}catch(x){$('#pve').innerHTML=errBox(x.message)}busy(b,false)};
  }).catch(err=>{$('#pane').innerHTML=errBox(err.message)});
}

async function boot(){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
